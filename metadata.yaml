abstract: |
  En este laboratorio se diseñó, simuló e implementó una cadena completa de acondicionamiento analógico de señales, protección por hardware y adquisición digital en tiempo real. El subsistema analógico se estructuró a partir de cuatro amplificadores operacionales LM741 en configuraciones modularizadas: una etapa diferencial con ganancia balanceada $A_d = 10.0$ ($R_1 = 1.0\,\mathrm{k}\Omega, R_2 = 10.0\,\mathrm{k}\Omega$), una etapa no inversora con ganancia $A_v = 2.0$ ($R_f = 10.0\,\mathrm{k}\Omega, R_{\mathrm{in}} = 10.0\,\mathrm{k}\Omega$) que establece una amplificación total en cascada de $A_{\mathrm{total}} = 20.0$, un filtro pasabajas pasivo $RC$ de primer orden ($R = 10.0\,\mathrm{k}\Omega, C = 100\,\mathrm{nF}$) con frecuencia de corte nominal $f_c = 159.15\,\mathrm{Hz}$ y constante de tiempo $\tau = 1.0\,\mathrm{ms}$, y un comparador de tensión con umbral de referencia en $V_{\mathrm{ref}} = 1.00\,\mathrm{V}$ para la activación de un indicador visual LED ante sobrecargas. A partir de una entrada diferencial de $60.0\,\mathrm{mV}$ ($V_2 = 80.0\,\mathrm{mV}, V_1 = 20.0\,\mathrm{mV}$), la cadena analógica acondicionó la señal a un nivel óptimo de $1.20\,\mathrm{V}$, garantizando un margen dinámico seguro por debajo de los $3.0\,\mathrm{V}$ admisibles para el microcontrolador. En la etapa de adquisición digital y supervisión, el microcontrolador ESP32 se integró con un sensor ultrasónico HC-SR04 para la medición y calibración de distancias (4 a 50 cm) con regresión lineal ($R^2 = 0.9998$), transmitiendo las tramas vía UART a 115200 baudios hacia un Instrumento Virtual (VI) en LabVIEW. Durante la sesión experimental en laboratorio se capturaron las evidencias físicas en una memoria USB que posteriormente sufrió un daño físico irreversible, por lo que los resultados se sustentan en modelos computacionales desarrollados en Python que replican con fidelidad el comportamiento observado.
