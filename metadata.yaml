abstract: |
  \begin{center}\textbf{\Large Abstract}\end{center}\vspace{0.8em}
  \textbf{Abstract}— This laboratory practice focused on the analysis and conditioning of electrical signals using different analog circuits and measurement techniques. In the first part, a signal was processed through several operational amplifier configurations, including an inverting amplifier, a differential amplifier, and a comparator. An RC filter was also implemented to observe its effect on the signal and to understand the function of each stage.

  In a separate activity, the output signal of an ultrasonic sensor was analyzed using an oscilloscope while an object was moved closer to and farther from the sensor. This allowed the variation in signal amplitude to be observed experimentally.

  Overall, the practice helped relate theoretical concepts such as amplification, comparison, filtering, and signal measurement with their practical behavior in electronic circuits and sensing systems.
